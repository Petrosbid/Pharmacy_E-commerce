{% load static %}

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link rel="apple-touch-icon" sizes="76x76" href="{% static "assets/img/apple-icon.png" %}">
<link rel="icon" type="image/png" href="{% static "assets/img/favicon.png" %}">

<title>
  {% block admin_title %}آرمان فارما | پنل مدیریت{% endblock %}
</title>

<!-- Fonts and icons -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
<!-- Nucleo Icons -->
<link href="{% static "assets/css/nucleo-icons.css" %}" rel="stylesheet" />
<link href="{% static "assets/css/nucleo-svg.css" %}" rel="stylesheet" />
<!-- Font Awesome Icons -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/js/all.min.js" crossorigin="anonymous"></script>
<!-- Material Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
<!-- CSS Files -->
<link id="pagestyle" href="{% static "assets/css/material-dashboard.css" %}?v=3.2.0" rel="stylesheet" />

{% if LANGUAGE_BIDI %}
<style>
    /* Basic RTL fixes for Material Dashboard */
    body.rtl {
        text-align: right;
        direction: rtl;
        font-family: 'Vazirmatn', sans-serif !important;
    }
    .rtl .ms-auto {
        margin-left: 0 !important;
        margin-right: auto !important;
    }
    .rtl .me-auto {
        margin-right: 0 !important;
        margin-left: auto !important;
    }
    .rtl .text-start {
        text-align: right !important;
    }
    .rtl .text-end {
        text-align: left !important;
    }
    .rtl .float-start {
        float: right !important;
    }
    .rtl .float-end {
        float: left !important;
    }
    /* Admin UI specific RTL fixes */
    .rtl .main-content {
        margin-right: 17.125rem !important;
        margin-left: 0 !important;
    }
    .rtl .sidenav {
        right: 0 !important;
        left: auto !important;
    }
    .rtl .navbar-nav {
        padding-right: 0 !important;
    }
    .rtl .breadcrumb-item + .breadcrumb-item::before {
        content: "\e5cb"; /* Arrow back icon */
        padding-left: 0.5rem;
        padding-right: 0.5rem;
    }
    @media (max-width: 1199.98px) {
        .rtl .main-content {
            margin-right: 0 !important;
        }
    }
</style>
{% endif %}
